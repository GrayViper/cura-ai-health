user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
  upstream app { server cura-app:3000; }
  upstream ocr { server ocr-service:5000; }
  upstream orthanc { server orthanc:8042; }
  upstream fhir { server hapi-fhir:8080; }
  upstream search { server searxng:8080; }
  server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    location / { try_files $uri $uri/ /index.html; }
    location /api/ocr/ { limit_req zone=api_limit burst=10 nodelay; proxy_pass http://ocr/api/v1/; proxy_read_timeout 120s; }
    location = /api/search { limit_req zone=api_limit burst=5 nodelay; proxy_pass http://app/api/search; }
    location = /api/semantic-search { limit_req zone=api_limit burst=5 nodelay; proxy_pass http://app/api/semantic-search; }
    location /orthanc/ { proxy_pass http://orthanc/; }
    location /fhir/ { proxy_pass http://fhir/fhir/; }
    location /search/ { proxy_pass http://search/; }
    location /health { access_log off; return 200 "healthy\n"; add_header Content-Type text/plain; }
    location ~ /\. { deny all; }
  }
}

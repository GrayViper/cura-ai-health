user nginx;
worker_processes auto;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  upstream app { server cura-app:3000; }
  upstream ocr { server ocr-service:5000; }
  upstream fhir { server hapi-fhir:8080; }
  upstream orthanc { server orthanc:8042; }
  upstream search { server searxng:8080; }
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }
  server {
    listen 443 ssl;
    server_name _;
    root /usr/share/nginx/html;
    ssl_certificate /etc/nginx/ssl/certs/server.crt;
    ssl_certificate_key /etc/nginx/ssl/private/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    location / { try_files $uri $uri/ /index.html; }
    location /api/ocr/ { proxy_pass http://ocr/api/v1/; client_max_body_size 50M; }
    location = /api/search { proxy_pass http://app/api/search; }
    location = /api/semantic-search { proxy_pass http://app/api/semantic-search; }
    location /orthanc/ { auth_basic "Orthanc Access"; auth_basic_user_file /etc/nginx/.htpasswd; proxy_pass http://orthanc/; }
    location /fhir/ { proxy_pass http://fhir/fhir/; }
    location /search/ { proxy_pass http://search/; }
    location /health { return 200 "healthy\n"; add_header Content-Type text/plain; }
  }
}
services:
  # Cura web application and privacy-preserving API proxy
  cura-app:
    build: .
    container_name: cura-app
    environment:
      PORT: 3000
      SEARXNG_URL: http://searxng:8080/search
      SEMANTIC_ENDPOINT: ${SEMANTIC_ENDPOINT:-}
      SEMANTIC_API_KEY: ${SEMANTIC_API_KEY:-}
    networks:
      - cura-network
    depends_on:
      searxng:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # OCR Microservice - Extract text from medical images/PDFs
  ocr-service:
    build: ./services/ocr
    container_name: cura-ocr-service
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - WORKERS=4
    volumes:
      - ocr-temp:/tmp/ocr
    networks:
      - cura-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Orthanc DICOM Server - Store and manage medical imaging
  orthanc:
    image: jodogne/orthanc:latest
    container_name: cura-orthanc
    ports:
      - "8042:8042"  # Web UI
      - "4242:4242"  # DICOM
    volumes:
      - ./config/orthanc.json:/etc/orthanc/orthanc.json:ro
      - orthanc-storage:/var/lib/orthanc/db
    networks:
      - cura-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8042/"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # HAPI FHIR Server - Clinical data standards
  hapi-fhir:
    image: hapiproject/hapi:latest
    container_name: cura-hapi-fhir
    ports:
      - "8080:8080"
    volumes:
      - hapi-storage:/data/hapi
    networks:
      - cura-network
    restart: unless-stopped

  # MySQL Database - available for a deployment-specific HAPI configuration
  mysql:
    image: mysql:8.0
    container_name: cura-mysql
    environment:
      MYSQL_DATABASE: hapi_fhir
      MYSQL_USER: ${DB_USER:-hapi_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-hapi_pass123}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_pass123}
    volumes:
      - mysql-storage:/var/lib/mysql
      - ./config/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - cura-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # searXNG - Privacy-focused metasearch for medical literature
  searxng:
    image: searxng/searxng:latest
    container_name: cura-searxng
    ports:
      - "8888:8080"
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888
    volumes:
      - ./config/searxng-settings.yml:/etc/searxng/settings.yml:ro
      - searxng-cache:/var/cache/searxng
    networks:
      - cura-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--header", "X-Real-IP: 127.0.0.1", "-O", "/dev/null", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Nginx Reverse Proxy - Route requests and TLS termination
  nginx:
    image: nginx:alpine
    container_name: cura-nginx
    ports:
      - "80:80"
    volumes:
      - ./config/nginx.development.conf:/etc/nginx/nginx.conf:ro
      - ./:/usr/share/nginx/html:ro
    networks:
      - cura-network
    depends_on:
      - cura-app
      - ocr-service
      - orthanc
      - hapi-fhir
      - searxng
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  ocr-temp:
  orthanc-storage:
  hapi-storage:
  mysql-storage:
  searxng-cache:

networks:
  cura-network:
    driver: bridge
